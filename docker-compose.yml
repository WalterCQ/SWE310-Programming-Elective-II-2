services:
  receipt-management-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: receipt-management-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:?Set SQL_PASSWORD in .env or your shell}"
    ports:
      - "1433:1433"
    volumes:
      - receipt-management-sql-data:/var/opt/mssql

volumes:
  receipt-management-sql-data:
